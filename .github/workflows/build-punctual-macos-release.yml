name: Build Punctual 0.1.0-alpha.5 macOS Release

on:
  push:
    branches:
      - punctual-publish-staging-20260818
    paths:
      - ".github/workflows/build-punctual-macos-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ARM64 DMG
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify native Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          xcodebuild -version

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            exports/source-tree/target
          key: macos-arm64-punctual-alpha5-release-${{ hashFiles('exports/source-tree/**/Cargo.toml', 'exports/source-tree/Cargo.lock') }}
          restore-keys: |
            macos-arm64-punctual-alpha5-release-
            macos-arm64-punctual-

      - name: Test and compile release binary
        working-directory: exports/source-tree
        env:
          CARGO_TERM_COLOR: never
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p punctual-browser --features cdp
          cargo build --release -p punctual-app
          test -x target/release/punctual-app
          test "$(lipo -archs target/release/punctual-app)" = "arm64"

      - name: Download managed browser resources
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="dist/runtime"
          mkdir -p "${RUNTIME}/managed-browser" "${RUNTIME}/bin"

          require_arm64() {
            local binary="$1"
            local architectures
            file "${binary}"
            architectures="$(lipo -archs "${binary}")"
            printf '%s\n' "${architectures}" | tr ' ' '\n' | grep -qx arm64
          }

          curl --fail --location --retry 3 \
            https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json \
            -o "${RUNTIME}/chrome-for-testing.json"
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("dist/runtime/chrome-for-testing.json").read_text())
          stable = data["channels"]["Stable"]
          match = next(
              item for item in stable["downloads"]["chrome"]
              if item["platform"] == "mac-arm64"
          )
          Path("dist/runtime/chrome-url.txt").write_text(match["url"])
          Path("dist/runtime/chrome-version.txt").write_text(stable["version"])
          print(f"Chrome for Testing stable: {stable['version']}")
          PY
          curl --fail --location --retry 3 \
            "$(cat "${RUNTIME}/chrome-url.txt")" \
            -o "${RUNTIME}/chrome-mac-arm64.zip"
          ditto -x -k "${RUNTIME}/chrome-mac-arm64.zip" "${RUNTIME}/chrome-extracted"
          CHROME_APP="$(find "${RUNTIME}/chrome-extracted" -type d -name 'Google Chrome for Testing.app' -print -quit)"
          test -n "${CHROME_APP}"
          ditto "${CHROME_APP}" "${RUNTIME}/managed-browser/Google Chrome for Testing.app"

          GECKO_VERSION="0.37.1"
          GECKO_ARCHIVE="geckodriver-v${GECKO_VERSION}-macos-aarch64.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/mozilla/geckodriver/releases/download/v${GECKO_VERSION}/${GECKO_ARCHIVE}" \
            -o "${RUNTIME}/${GECKO_ARCHIVE}"
          curl --fail --location --retry 3 \
            "https://api.github.com/repos/mozilla/geckodriver/releases/tags/v${GECKO_VERSION}" \
            -o "${RUNTIME}/geckodriver-release.json"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          release = json.loads(Path("dist/runtime/geckodriver-release.json").read_text())
          name = "geckodriver-v0.37.1-macos-aarch64.tar.gz"
          asset = next(item for item in release["assets"] if item["name"] == name)
          digest = asset.get("digest") or ""
          if digest.startswith("sha256:"):
              actual = hashlib.sha256(Path(f"dist/runtime/{name}").read_bytes()).hexdigest()
              expected = digest.removeprefix("sha256:")
              if actual != expected:
                  raise SystemExit("geckodriver SHA-256 mismatch")
          PY
          tar -xzf "${RUNTIME}/${GECKO_ARCHIVE}" -C "${RUNTIME}/bin"
          chmod 755 "${RUNTIME}/bin/geckodriver"

          CHROME_BIN="${RUNTIME}/managed-browser/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          require_arm64 "${CHROME_BIN}"
          require_arm64 "${RUNTIME}/bin/geckodriver"

      - name: Assemble and ad-hoc sign app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Punctual.app"
          CONTENTS="${APP}/Contents"
          MACOS="${CONTENTS}/MacOS"
          RESOURCES="${CONTENTS}/Resources"

          rm -rf "${APP}" dist/dmg-root
          mkdir -p "${MACOS}" "${RESOURCES}/managed-browser" "${RESOURCES}/bin"
          cp exports/source-tree/target/release/punctual-app "${MACOS}/Punctual"
          chmod 755 "${MACOS}/Punctual"
          ditto "dist/runtime/managed-browser/Google Chrome for Testing.app" \
            "${RESOURCES}/managed-browser/Google Chrome for Testing.app"
          cp "dist/runtime/bin/geckodriver" "${RESOURCES}/bin/geckodriver"
          chmod 755 "${RESOURCES}/bin/geckodriver"
          cp "dist/runtime/chrome-version.txt" "${RESOURCES}/managed-browser/version.txt"

          cat > "${CONTENTS}/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0.dtd" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>zh_CN</string>
            <key>CFBundleDisplayName</key><string>Punctual</string>
            <key>CFBundleExecutable</key><string>Punctual</string>
            <key>CFBundleIdentifier</key><string>com.punctual.desktop</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Punctual</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0-alpha.5</string>
            <key>CFBundleVersion</key><string>5</string>
            <key>LSArchitecturePriority</key><array><string>arm64</string></array>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          PLIST

          plutil -lint "${CONTENTS}/Info.plist"
          codesign --force --deep --sign - --timestamp=none \
            "${RESOURCES}/managed-browser/Google Chrome for Testing.app"
          codesign --force --sign - --timestamp=none "${RESOURCES}/bin/geckodriver"
          codesign --force --deep --sign - --timestamp=none "${APP}"
          codesign --verify --deep --strict --verbose=2 "${APP}"
          test "$(lipo -archs "${MACOS}/Punctual")" = "arm64"

      - name: Build and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          DMG_ROOT="dist/dmg-root"
          DMG="dist/Punctual-0.1.0-alpha.5-macos-arm64.dmg"
          mkdir -p "${DMG_ROOT}"
          ditto "dist/Punctual.app" "${DMG_ROOT}/Punctual.app"
          ln -s /Applications "${DMG_ROOT}/Applications"
          hdiutil create \
            -volname "Punctual 0.1.0-alpha.5" \
            -srcfolder "${DMG_ROOT}" \
            -ov \
            -format UDZO \
            "${DMG}"
          hdiutil verify "${DMG}"
          HASH="$(shasum -a 256 "${DMG}" | awk '{print $1}')"
          BYTES="$(stat -f %z "${DMG}")"
          printf '%s  %s\n' "${HASH}" "$(basename "${DMG}")" > "dist/Punctual-0.1.0-alpha.5-macos-arm64-SHA256SUMS.txt"
          cat > dist/macos-build-manifest.json <<JSON
          {
            "version": "0.1.0-alpha.5",
            "platform": "macos-arm64",
            "run_id": "${GITHUB_RUN_ID}",
            "artifact_name": "Punctual-0.1.0-alpha.5-macos-arm64",
            "dmg_sha256": "${HASH}",
            "dmg_bytes": ${BYTES}
          }
          JSON

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Punctual-0.1.0-alpha.5-macos-arm64
          path: |
            dist/Punctual-0.1.0-alpha.5-macos-arm64.dmg
            dist/Punctual-0.1.0-alpha.5-macos-arm64-SHA256SUMS.txt
            dist/macos-build-manifest.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Publish build manifest to staging branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exports/build-results/macos
          cp dist/macos-build-manifest.json exports/build-results/macos/MANIFEST.json
          cp dist/Punctual-0.1.0-alpha.5-macos-arm64-SHA256SUMS.txt exports/build-results/macos/SHA256SUMS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/build-results/macos
          if ! git diff --cached --quiet; then
            git commit -m "build: record Punctual macOS artifacts [skip ci]"
            git push
          fi
