name: Bootstrap PasteGuard

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore project source
        shell: bash
        run: |
          cat bootstrap/source.part-* > /tmp/pasteguard-source.b64
          base64 --decode /tmp/pasteguard-source.b64 > /tmp/pasteguard-source.tar.gz
          echo '8d1966e68b044764ad369b7781ea8a9e5690ae9b0f9da194667833b560a05ef3  /tmp/pasteguard-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/pasteguard-source.tar.gz -C .
          rm -rf bootstrap .github/workflows/bootstrap.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build release formats
        run: npm run check

      - name: Capture synthetic product screenshot
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.52.0
          npx playwright install --with-deps chromium
          npm run preview > /tmp/pasteguard-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null
          cat > scripts/.capture-preview.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 1280, height: 996 },
            deviceScaleFactor: 1,
          });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.locator('#load-sample').click();
          await page.waitForTimeout(500);
          await page.screenshot({ path: 'docs/preview.png' });
          await browser.close();
          EOF
          node scripts/.capture-preview.mjs
          rm scripts/.capture-preview.mjs

      - name: Commit initial release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Initial PasteGuard release'
          git push origin HEAD:main
