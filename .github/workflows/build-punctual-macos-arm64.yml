name: Build Punctual macOS ARM64 New-Tab Result Fix

on:
  push:
    branches:
      - punctual-new-tab-fix-20260817
    paths:
      - "build/punctual-macos-arm64/**"
      - "payloads/punctual-macos-arm64/**"
      - ".github/workflows/build-punctual-macos-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: punctual-new-tab-alpha4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and package ARM64 DMG
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out temporary build branch
        uses: actions/checkout@v4

      - name: Confirm native Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"
          xcodebuild -version

      - name: Reconstruct source and apply verified overlays
        shell: bash
        run: |
          set -euo pipefail
          cat build/punctual-macos-arm64/chunks/part-* > punctual-source.b64
          python3 - <<'PY'
          import base64
          from pathlib import Path

          encoded = b"".join(Path("punctual-source.b64").read_bytes().split())
          Path("punctual-source.tar.xz").write_bytes(base64.b64decode(encoded, validate=True))
          PY

          source_expected="17402d1468c1bb9d06fe6cfbdabacc14c64e99cd9086a4f4f5025d8797c92efd"
          source_actual="$(shasum -a 256 punctual-source.tar.xz | awk '{print $1}')"
          echo "Source archive SHA-256: ${source_actual}"
          test "${source_actual}" = "${source_expected}"

          mkdir -p work
          tar -xJf punctual-source.tar.xz -C work
          test -f work/punctual-click/Cargo.toml

          python3 - <<'PY'
          import base64
          from pathlib import Path

          payloads = [
              ("payloads/punctual-macos-arm64/overlay-scripts.tar.xz.b64", "overlay-scripts.tar.xz"),
              ("payloads/punctual-macos-arm64/overlay-app.tar.xz.b64", "overlay-app.tar.xz"),
              ("payloads/punctual-macos-arm64/overlay-product-polish.tar.xz.b64", "overlay-product-polish.tar.xz"),
              ("payloads/punctual-macos-arm64/overlay-new-tab-alpha4.tar.xz.b64", "overlay-new-tab-alpha4.tar.xz"),
          ]
          for source, target in payloads:
              encoded = b"".join(Path(source).read_bytes().split())
              Path(target).write_bytes(base64.b64decode(encoded, validate=True))
          PY

          check_hash() {
            local file="$1"
            local expected="$2"
            local actual
            actual="$(shasum -a 256 "${file}" | awk '{print $1}')"
            echo "${file} SHA-256: ${actual}"
            test "${actual}" = "${expected}"
          }

          check_hash overlay-scripts.tar.xz 8578bb9c595ffc5fcf944311754dfb383e952dbd306fb7783d30dc841c6c8f7d
          check_hash overlay-app.tar.xz 2493959afffb3a7637506c027d970dd2e2af4f03a72e17b0a2f410f9d9fb784f
          check_hash overlay-product-polish.tar.xz e184f9538dc81c764291f1ef212e71c3f0a4d9595290ffa6837381d28883a16b
          check_hash overlay-new-tab-alpha4.tar.xz f22d8cac6ececbfe54a5c8221ad595b688f09fa6467aebba6e5d991aaa903f85

          tar -xJf overlay-scripts.tar.xz -C work/punctual-click
          tar -xJf overlay-app.tar.xz -C work/punctual-click
          tar -xJf overlay-product-polish.tar.xz -C work/punctual-click
          tar -xJf overlay-new-tab-alpha4.tar.xz -C work/punctual-click

          grep -q 'version = "0.1.0-alpha.4"' work/punctual-click/Cargo.toml
          grep -q 'existing_target_keys' work/punctual-click/crates/punctual-browser/src/chromium.rs
          grep -q 'self.browser.pages().await' work/punctual-click/crates/punctual-browser/src/chromium.rs
          grep -q 'DirectNew' work/punctual-click/crates/punctual-browser/src/chromium.rs
          grep -q 'verify_completion(page, &dispatch' work/punctual-click/crates/punctual-engine/src/worker.rs

      - name: Run source checks
        working-directory: work/punctual-click
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rust-delimiter-check.py
          node --check scripts/detect_buttons.js
          node --check scripts/highlight_button.js
          node --check scripts/probe_target.js

      - name: Install stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Restore Cargo build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            work/punctual-click/target
          key: macos-arm64-punctual-alpha4-${{ hashFiles('build/punctual-macos-arm64/chunks/**', 'payloads/punctual-macos-arm64/**') }}
          restore-keys: |
            macos-arm64-punctual-alpha4-
            macos-arm64-punctual-alpha3-
            macos-arm64-punctual-

      - name: Test browser and engine crates
        working-directory: work/punctual-click
        env:
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p punctual-browser --features cdp
          cargo test -p punctual-engine

      - name: Compile Punctual release binary
        working-directory: work/punctual-click
        env:
          CARGO_TERM_COLOR: never
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          set +e
          cargo build --release -p punctual-app 2>&1 | tee "$GITHUB_WORKSPACE/dist/cargo-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ "${build_status}" -ne 0 ]]; then
            exit "${build_status}"
          fi
          test -x target/release/punctual-app

      - name: Upload Cargo build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Punctual-alpha4-cargo-build-log
          path: dist/cargo-build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Assemble and verify ad-hoc signed app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Punctual.app"
          CONTENTS="${APP}/Contents"
          MACOS="${CONTENTS}/MacOS"
          RESOURCES="${CONTENTS}/Resources"

          rm -rf "${APP}" dist/dmg-root dist/Punctual-0.1.0-alpha.4-macos-arm64.dmg dist/Punctual-0.1.0-alpha.4-macos-arm64.dmg.sha256
          mkdir -p "${MACOS}" "${RESOURCES}"
          cp work/punctual-click/target/release/punctual-app "${MACOS}/Punctual"
          chmod 755 "${MACOS}/Punctual"

          cat > "${CONTENTS}/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0.dtd" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>zh_CN</string>
            <key>CFBundleDisplayName</key>
            <string>Punctual</string>
            <key>CFBundleExecutable</key>
            <string>Punctual</string>
            <key>CFBundleIdentifier</key>
            <string>com.punctual.desktop</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Punctual</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0-alpha.4</string>
            <key>CFBundleVersion</key>
            <string>4</string>
            <key>LSArchitecturePriority</key>
            <array>
              <string>arm64</string>
            </array>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
          </dict>
          </plist>
          PLIST

          plutil -lint "${CONTENTS}/Info.plist"
          codesign --force --deep --sign - --timestamp=none "${APP}"
          codesign --verify --deep --strict --verbose=2 "${APP}"

          file "${MACOS}/Punctual"
          archs="$(lipo -archs "${MACOS}/Punctual")"
          echo "Mach-O architectures: ${archs}"
          test "${archs}" = "arm64"
          otool -L "${MACOS}/Punctual"
          version="$(defaults read "$(pwd)/${CONTENTS}/Info" CFBundleShortVersionString)"
          test "${version}" = "0.1.0-alpha.4"

      - name: Build and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          DMG_ROOT="dist/dmg-root"
          DMG="dist/Punctual-0.1.0-alpha.4-macos-arm64.dmg"

          mkdir -p "${DMG_ROOT}"
          cp -R "dist/Punctual.app" "${DMG_ROOT}/Punctual.app"
          ln -s /Applications "${DMG_ROOT}/Applications"

          hdiutil create \
            -volname "Punctual 0.1.0-alpha.4" \
            -srcfolder "${DMG_ROOT}" \
            -ov \
            -format UDZO \
            "${DMG}"

          hdiutil verify "${DMG}"
          shasum -a 256 "${DMG}" | tee "${DMG}.sha256"
          ls -lh "${DMG}" "${DMG}.sha256"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Punctual-0.1.0-alpha.4-macos-arm64
          path: |
            dist/Punctual-0.1.0-alpha.4-macos-arm64.dmg
            dist/Punctual-0.1.0-alpha.4-macos-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 1
