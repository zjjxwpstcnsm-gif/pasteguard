name: Build Punctual macOS ARM64 Product Polish

on:
  push:
    branches:
      - punctual-product-polish-20260817
    paths:
      - "build/punctual-macos-arm64/**"
      - "payloads/punctual-macos-arm64/**"
      - ".github/workflows/build-punctual-macos-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: punctual-product-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, verify and package ARM64 DMG
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out temporary product-polish branch
        uses: actions/checkout@v4

      - name: Confirm native Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"
          xcodebuild -version

      - name: Reconstruct source and apply verified overlays
        shell: bash
        run: |
          set -euo pipefail
          cat build/punctual-macos-arm64/chunks/part-* > punctual-source.b64
          python3 - <<'PY'
          import base64
          from pathlib import Path

          encoded = Path("punctual-source.b64").read_bytes()
          Path("punctual-source.tar.xz").write_bytes(base64.b64decode(encoded, validate=True))
          PY

          expected="17402d1468c1bb9d06fe6cfbdabacc14c64e99cd9086a4f4f5025d8797c92efd"
          actual="$(shasum -a 256 punctual-source.tar.xz | awk '{print $1}')"
          echo "Source archive SHA-256: ${actual}"
          test "${actual}" = "${expected}"

          mkdir -p work
          tar -xJf punctual-source.tar.xz -C work
          test -f work/punctual-click/Cargo.toml

          python3 - <<'PY'
          import base64
          from pathlib import Path

          payloads = [
              ("payloads/punctual-macos-arm64/overlay-scripts.tar.xz.b64", "overlay-scripts.tar.xz"),
              ("payloads/punctual-macos-arm64/overlay-app.tar.xz.b64", "overlay-app.tar.xz"),
              ("payloads/punctual-macos-arm64/overlay-product-polish.tar.xz.b64", "overlay-product-polish.tar.xz"),
          ]
          for source, target in payloads:
              encoded = b"".join(Path(source).read_bytes().split())
              Path(target).write_bytes(base64.b64decode(encoded, validate=True))
          PY

          scripts_expected="8578bb9c595ffc5fcf944311754dfb383e952dbd306fb7783d30dc841c6c8f7d"
          scripts_actual="$(shasum -a 256 overlay-scripts.tar.xz | awk '{print $1}')"
          echo "Scripts overlay SHA-256: ${scripts_actual}"
          test "${scripts_actual}" = "${scripts_expected}"

          app_expected="2493959afffb3a7637506c027d970dd2e2af4f03a72e17b0a2f410f9d9fb784f"
          app_actual="$(shasum -a 256 overlay-app.tar.xz | awk '{print $1}')"
          echo "Compatibility overlay SHA-256: ${app_actual}"
          test "${app_actual}" = "${app_expected}"

          polish_expected="e184f9538dc81c764291f1ef212e71c3f0a4d9595290ffa6837381d28883a16b"
          polish_actual="$(shasum -a 256 overlay-product-polish.tar.xz | awk '{print $1}')"
          echo "Product-polish overlay SHA-256: ${polish_actual}"
          test "${polish_actual}" = "${polish_expected}"

          tar -xJf overlay-scripts.tar.xz -C work/punctual-click
          tar -xJf overlay-app.tar.xz -C work/punctual-click
          tar -xJf overlay-product-polish.tar.xz -C work/punctual-click

          test -f work/punctual-click/scripts/detect_buttons.js
          test -f work/punctual-click/scripts/highlight_button.js
          test -f work/punctual-click/scripts/probe_target.js
          grep -q 'version = "0.1.0-alpha.3"' work/punctual-click/Cargo.toml
          grep -q 'overflow_y_scrollbar' work/punctual-click/crates/punctual-app/src/dashboard.rs
          grep -q 'ClipboardItem::new_string' work/punctual-click/crates/punctual-app/src/dashboard.rs
          grep -q 'window_min_size' work/punctual-click/crates/punctual-app/src/main.rs

      - name: Run source consistency checks
        working-directory: work/punctual-click
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/project-consistency-check.py
          node --check scripts/detect_buttons.js
          node --check scripts/highlight_button.js
          node --check scripts/probe_target.js

      - name: Install stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Restore Cargo build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            work/punctual-click/target
          key: macos-arm64-punctual-alpha3-${{ hashFiles('build/punctual-macos-arm64/chunks/**', 'payloads/punctual-macos-arm64/**') }}
          restore-keys: |
            macos-arm64-punctual-alpha3-
            macos-arm64-punctual-

      - name: Compile Punctual release binary
        working-directory: work/punctual-click
        env:
          CARGO_TERM_COLOR: never
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          set +e
          cargo build --release -p punctual-app 2>&1 | tee "$GITHUB_WORKSPACE/dist/cargo-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ "${build_status}" -ne 0 ]]; then
            exit "${build_status}"
          fi
          test -x target/release/punctual-app

      - name: Upload Cargo build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Punctual-alpha3-cargo-build-log
          path: dist/cargo-build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Assemble and verify ad-hoc signed app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/Punctual.app"
          CONTENTS="${APP}/Contents"
          MACOS="${CONTENTS}/MacOS"
          RESOURCES="${CONTENTS}/Resources"

          rm -rf "${APP}" dist/dmg-root dist/Punctual-0.1.0-alpha.3-macos-arm64.dmg dist/Punctual-0.1.0-alpha.3-macos-arm64.dmg.sha256
          mkdir -p "${MACOS}" "${RESOURCES}"
          cp work/punctual-click/target/release/punctual-app "${MACOS}/Punctual"
          chmod 755 "${MACOS}/Punctual"

          cat > "${CONTENTS}/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0.dtd" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>zh_CN</string>
            <key>CFBundleDisplayName</key>
            <string>Punctual</string>
            <key>CFBundleExecutable</key>
            <string>Punctual</string>
            <key>CFBundleIdentifier</key>
            <string>com.punctual.desktop</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Punctual</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0-alpha.3</string>
            <key>CFBundleVersion</key>
            <string>3</string>
            <key>LSArchitecturePriority</key>
            <array>
              <string>arm64</string>
            </array>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
          </dict>
          </plist>
          PLIST

          plutil -lint "${CONTENTS}/Info.plist"
          codesign --force --deep --sign - --timestamp=none "${APP}"
          codesign --verify --deep --strict --verbose=2 "${APP}"

          file "${MACOS}/Punctual"
          archs="$(lipo -archs "${MACOS}/Punctual")"
          echo "Mach-O architectures: ${archs}"
          test "${archs}" = "arm64"
          otool -L "${MACOS}/Punctual"
          defaults read "$(pwd)/${CONTENTS}/Info" CFBundleShortVersionString

      - name: Build and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          DMG_ROOT="dist/dmg-root"
          DMG="dist/Punctual-0.1.0-alpha.3-macos-arm64.dmg"

          mkdir -p "${DMG_ROOT}"
          cp -R "dist/Punctual.app" "${DMG_ROOT}/Punctual.app"
          ln -s /Applications "${DMG_ROOT}/Applications"

          hdiutil create \
            -volname "Punctual 0.1.0-alpha.3" \
            -srcfolder "${DMG_ROOT}" \
            -ov \
            -format UDZO \
            "${DMG}"

          hdiutil verify "${DMG}"
          shasum -a 256 "${DMG}" | tee "${DMG}.sha256"
          ls -lh "${DMG}" "${DMG}.sha256"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Punctual-0.1.0-alpha.3-macos-arm64
          path: |
            dist/Punctual-0.1.0-alpha.3-macos-arm64.dmg
            dist/Punctual-0.1.0-alpha.3-macos-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 1
